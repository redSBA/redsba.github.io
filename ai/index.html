<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>redSBA ai</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0f12;
  --panel: #18181d;
  --border: #2a2a33;
  --text: #eaeaf0;
  --muted: #8b8b99;
  --red: #e53935;
  --red-2: #ff7043;
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- Шапка ---------- */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  position: relative; z-index: 20;
}
.logo { font-weight: 700; font-size: 1.3rem; }
.logo span { color: var(--red); }
.top-right { display: flex; align-items: center; gap: 10px; max-width: 70%; }

.ghost-btn {
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 10px; cursor: pointer; display: inline-flex;
  transition: border-color .2s, color .2s, transform .15s;
}
.ghost-btn:hover { border-color: var(--red); color: var(--red); }
.ghost-btn:active { transform: scale(.94); }

/* ---------- Выбор модели ---------- */
.model-wrap { position: relative; min-width: 0; }
.model-btn {
  display: flex; align-items: center; gap: 8px; max-width: 100%;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; cursor: pointer; font: inherit; font-size: 0.9rem;
  transition: border-color .2s;
}
.model-btn:hover { border-color: var(--red); }
.model-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-btn svg { flex-shrink: 0; color: var(--muted); transition: transform .3s cubic-bezier(.4,0,.2,1); }
.model-wrap.open .model-btn svg { transform: rotate(180deg); }

.model-panel {
  position: absolute; top: calc(100% + 8px); right: 0;
  width: min(360px, 90vw); max-height: 60vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.5);
  padding: 6px;
  opacity: 0; transform: translateY(-10px) scale(.96); transform-origin: top right;
  pointer-events: none;
  transition: opacity .22s ease, transform .28s cubic-bezier(.2,.8,.2,1);
}
.model-wrap.open .model-panel { opacity: 1; transform: none; pointer-events: auto; }

.model-item {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 8px; cursor: pointer;
  font-size: 0.9rem; word-break: break-all;
  opacity: 0; transform: translateY(-4px);
  transition: background .15s, color .15s;
}
.model-wrap.open .model-item {
  animation: itemIn .3s ease forwards;
  animation-delay: calc(var(--i, 0) * 25ms);
}
@keyframes itemIn { to { opacity: 1; transform: none; } }
.model-item:hover { background: var(--border); }
.model-item.active { color: var(--red); }
.model-item svg { flex-shrink: 0; opacity: 0; transition: opacity .2s; }
.model-item.active svg { opacity: 1; }

/* ---------- Чат ---------- */
#chat {
  flex: 1; overflow-y: auto; padding: 20px 20px 8px;
  display: flex; flex-direction: column;
}
.hero { margin: auto; text-align: center; }
.hero h1 { font-size: 2.2rem; margin-bottom: 8px; }
.hero p { color: var(--muted); }
.hero.hidden { display: none; }

.messages { width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.msg {
  padding: 12px 16px; border-radius: 14px; line-height: 1.5;
  white-space: pre-wrap; word-wrap: break-word; max-width: 85%;
  animation: msgIn .25s ease;
}
@keyframes msgIn { from { opacity: 0; } to { opacity: 1; } }
.msg.user { align-self: flex-end; background: var(--red); color: #fff; }
.msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
.msg.error { border-color: var(--red); color: #ff8a80; }
.typing { opacity: .6; font-style: italic; }

/* ---------- Плавающее поле ввода ---------- */
.composer-wrap {
  position: sticky; bottom: 0;
  padding: 24px 16px 18px;
  background: linear-gradient(to bottom, transparent, var(--bg) 40%);
}
.file-list { max-width: 800px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.file-chip {
  background: var(--panel); border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; color: var(--muted);
  display: flex; align-items: center; gap: 6px; animation: msgIn .2s ease;
}
.file-chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; }

.composer {
  max-width: 800px; margin: 0 auto;
  display: flex; align-items: flex-end; gap: 10px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 18px; padding: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
  transition: border-color .2s, box-shadow .2s;
}
.composer:focus-within { border-color: var(--red); box-shadow: 0 10px 30px rgba(229,57,53,.15); }
.composer textarea {
  flex: 1; resize: none; background: transparent; border: none; outline: none;
  color: var(--text); font: inherit; max-height: 160px; padding: 8px;
}

/* ---------- Кнопки ---------- */
.icon-btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 12px; }
.composer label.icon-btn { color: var(--text); }
#sendBtn { min-width: 52px; }

/* 1. Градиент с бегущим бликом */
.btn-gradient {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--red), var(--red-2));
  color: #fff; border: none; border-radius: 12px;
  padding: 10px 18px; font-weight: 600; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.3s;
}
.btn-gradient::after {
  content: ""; position: absolute; top: 0; left: -75%;
  width: 50%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,.45), transparent);
  transform: skewX(-20deg); transition: left 0.5s;
}
.btn-gradient:hover::after { left: 125%; }
.btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(229,57,53,.4); }
.btn-gradient:active { transform: translateY(0); }
.btn-gradient:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

/* 2. Контур с заливкой */
.btn-outline {
  position: relative; z-index: 0; overflow: hidden;
  background: transparent; color: var(--text);
  border: 2px solid var(--red); border-radius: 12px;
  padding: 8px 14px; cursor: pointer; font-size: 1.1rem;
  transition: color 0.3s;
}
.btn-outline::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--red); transform: scaleX(0); transform-origin: left;
  transition: transform 0.35s ease;
}
.btn-outline:hover { color: #fff; }
.btn-outline:hover::before { transform: scaleX(1); }

/* 3. Объёмная кнопка с нажатием */
.btn-3d {
  background: var(--red); color: #fff; border: none; border-radius: 12px;
  padding: 10px 18px; font-weight: 600; cursor: pointer;
  box-shadow: 0 6px 0 #8e1f1c; transition: transform .1s, box-shadow .1s;
}
.btn-3d:hover { background: #f04a45; }
.btn-3d:active { transform: translateY(6px); box-shadow: 0 0 0 #8e1f1c; }

/* ---------- Картинки ---------- */
.msg.image-msg { padding: 10px; max-width: 90%; }
.img-block { display: flex; flex-direction: column; gap: 8px; }
.img-block img {
  width: 100%; max-width: 480px; border-radius: 10px; display: block;
  cursor: zoom-in; transition: transform .2s;
}
.img-block img:hover { transform: scale(1.01); }
.img-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
.img-row .ghost-btn { padding: 6px 8px; }

/* ---------- Выбор модели под полем ввода ---------- */
.model-row { max-width: 800px; margin: 0 auto 8px; display: flex; }
.model-row .model-wrap { position: relative; }
.model-row .model-btn { font-size: 0.85rem; padding: 6px 10px; border-radius: 8px; }
.model-row .model-panel {
  top: auto; bottom: calc(100% + 8px); left: 0; right: auto;
  width: min(360px, 90vw); max-height: 55vh;
  transform-origin: bottom left;
  transform: translateY(10px) scale(.96);
}
.model-row .model-wrap.open .model-panel { transform: none; }
.model-row .model-btn span { max-width: 60vw; }

.model-search {
  width: 100%; margin-bottom: 6px; padding: 8px 10px;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  font: inherit; font-size: 0.9rem; outline: none;
}
.model-search:focus { border-color: var(--red); }
.model-list { display: flex; flex-direction: column; }

/* ---------- Закреплённый поиск ---------- */
.model-row .model-panel {
  display: flex; flex-direction: column; overflow: hidden;
  padding: 8px;
}
.model-row .model-search {
  flex-shrink: 0; margin-bottom: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.model-row .model-list {
  flex: 1; min-height: 0; overflow-y: auto;
}

/* ---------- Файлы от модели ---------- */
.file-card {
  display: flex; align-items: center; gap: 10px;
  margin-top: 10px; padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
  white-space: normal;
}
.file-card .file-meta { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.file-card .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem; }
.file-card .file-size { font-size: 0.75rem; color: var(--muted); }
.file-card .ghost-btn { padding: 6px 8px; }

/* ---------- Верхние кнопки ---------- */
.top-actions { display: flex; gap: 8px; }

/* ---------- Настройки ---------- */
.modal {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center;
  padding: 16px; animation: fadeIn .2s ease;
}
.modal.hidden { display: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  width: min(460px, 100%); max-height: 85vh; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,.6);
  animation: modalIn .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600;
}
.modal-body { padding: 4px 16px 16px; overflow-y: auto; }
.section-title {
  margin: 18px 0 10px; font-size: 0.78rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em;
}
.setting-row {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 8px 0; font-size: 0.92rem;
}
.row-actions { display: flex; align-items: center; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; font-size: 0.9rem; }
.text-input {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font: inherit; font-size: 0.9rem; outline: none; margin-top: 8px;
}
.text-input:focus { border-color: var(--red); }
textarea.text-input { resize: vertical; }

.switch {
  appearance: none; -webkit-appearance: none;
  width: 44px; height: 24px; border-radius: 999px; flex-shrink: 0;
  background: var(--border); position: relative; cursor: pointer; transition: background .2s;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%; background: #fff;
  transition: transform .2s;
}
.switch:checked { background: var(--red); }
.switch:checked::after { transform: translateX(20px); }
.modal .btn-gradient { margin-top: 10px; width: 100%; }

/* ---------- Карточка презентации ---------- */
.file-card .file-kind-pptx { color: var(--red); }

/* ---------- Комментарии модели ---------- */
.msg.comment {
  align-self: flex-start; max-width: 85%;
  background: transparent; border: 1px dashed var(--border);
  color: var(--muted); font-size: 0.85rem; font-style: italic;
}

/* ---------- Скиллы ---------- */
.skill-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.skill-desc {
  font-size: 0.78rem; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.upload-btn { display: block; text-align: center; margin-top: 12px; cursor: pointer; font-size: 0.95rem; }

/* ---------- Плавающий поиск внизу списка ---------- */
.model-row .model-panel { padding: 8px 8px 14px; }
.model-row .model-search-wrap {
  flex-shrink: 0; margin-top: 8px; padding: 0 4px;
}
.model-row .model-search {
  margin: 0; width: 100%; border-radius: 999px;
  padding: 9px 16px;
  background: var(--bg);
  box-shadow: 0 8px 22px rgba(0,0,0,.55), 0 0 0 1px var(--border);
  transition: box-shadow .2s, border-color .2s;
}
.model-row .model-search:focus {
  box-shadow: 0 8px 22px rgba(0,0,0,.55), 0 0 0 1px var(--red);
}

/* ---------- Фиксированная раскладка: шапка не уезжает ---------- */
html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  position: fixed; inset: 0;
  height: 100dvh;
}
.topbar { flex-shrink: 0; }
.composer-wrap { flex-shrink: 0; }
#chat { overscroll-behavior: contain; min-height: 0; }

/* ---------- Капча ---------- */
.captcha-body { display: flex; flex-direction: column; gap: 8px; }
.captcha-text { color: var(--muted); font-size: 0.9rem; }
.captcha-q { font-size: 1.4rem; font-weight: 600; text-align: center; margin: 6px 0; }
.captcha-err { color: #ff8a80; font-size: 0.85rem; min-height: 1.2em; }
.captcha-body .btn-gradient { width: 100%; }

</style>
  <script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>
</head>

function buildSystemPrompt() {
  const parts = [BASE_PROMPT];
  for (const key of Object.keys(PLUGIN_PROMPTS)) {
    if (settings.plugins[key]) parts.push(PLUGIN_PROMPTS[key]);
  }
  for (const sk of settings.skills) {
    if (sk.enabled && sk.body) {

      parts.push(`${head}\n\n${sk.body}`);
    }
  }

// Разбор SKILL.md: блок frontmatter (name, description) и инструкции
function parseSkillMd(raw) {
  const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  const meta = {};
  let body = raw;
  if (m) {
    m[1].split("\n").forEach((line) => {
      const i = line.indexOf(":");
      if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim().replace(/^["']|["']$/g, "");
    });
    body = raw.slice(m[0].length);
  }
  return {
    name: meta.name || "Без названия",
    description: meta.description || "",
    body: body.trim(),
  };
}

// Читает SKILL.md напрямую или достаёт его из .zip
async function readSkillFile(file) {
  if (file.size > 300 * 1024) throw new Error("файл больше 300 КБ");
  let raw;
  if (file.name.toLowerCase().endsWith(".zip")) {
    if (typeof JSZip === "undefined") throw new Error("библиотека архивов не загрузилась");
    const zip = await JSZip.loadAsync(file);
    const entry = Object.values(zip.files).find((f) => !f.dir && /(^|\/)SKILL\.md$/i.test(f.name));
    if (!entry) throw new Error("в архиве нет SKILL.md");
    raw = await entry.async("string");
  } else {
    raw = await readAs(file, "text");
  }
  return parseSkillMd(raw);
}

// ===== Запросы с перебором ключей и таймаутом =====
// Если ключ не подошёл (нет баланса, 401/403/429), пробуем следующий.
async function apiFetch(path, init = {}) {
  const { timeout = 90000, ...rest } = init;
  if (CONFIG.API_KEYS.some((k) => k.includes("PASTE"))) {
    throw new Error("не вставлен публичный ключ pk_... в CONFIG.API_KEYS");
  }
  let last = null;
  for (const key of CONFIG.API_KEYS.length ? CONFIG.API_KEYS : [null]) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    let res;
    try {
      res = await fetch(`${CONFIG.BASE_URL}${path}`, {
        ...rest,
        signal: ctrl.signal,
        headers: key ? { ...(rest.headers || {}), Authorization: `Bearer ${key}` } : { ...(rest.headers || {}) },
      });
    } finally {
      clearTimeout(timer);
    }
    if (res.ok) return res;
    last = res;
    const body = await res.clone().text();
    const retry = [401, 402, 403, 429].includes(res.status) || body.includes("credits");
    if (!retry) return res;
  }
  return last;
}

// ===== Файлы и презентации от модели =====
function trimNl(s) {
  return s.replace(/^\n/, "").replace(/\n$/, "");
}

// Достаёт из ответа файлы, презентации и теги картинок
function parseAnswer(raw) {
  const files = [];
  const images = [];
  const comments = [];
  let text = raw.replace(/<comment>([\s\S]*?)<\/comment>/g, (_, c) => {
    comments.push(c.trim());
    return "";
  });
  text = text.replace(/<file name="([^"]+)">([\s\S]*?)<\/file>/g, (_, name, content) => {
    files.push({ kind: "text", name, content: trimNl(content) });
    return "";
  });
  text = text.replace(/<presentation name="([^"]+)">([\s\S]*?)<\/presentation>/g, (_, name, body) => {
    const slides = [];
    body.replace(/<slide([^>]*)>([\s\S]*?)<\/slide>/g, (__, attrs, inner) => {
      const attr = (n) => (attrs.match(new RegExp(n + '="([^"]*)"')) || [])[1] || "";
      const bullets = inner
        .split("\n")
        .map((l) => l.trim())
        .filter((l) => l.startsWith("- "))
        .map((l) => l.slice(2));
      const imagePrompt = (inner.match(/<image prompt="([^"]+)"\s*\/>/) || [])[1] || "";
      slides.push({
        title: attr("title"),
        bullets,
        transition: attr("transition") || "none",
        animate: attr("animate") || "none",
        imagePrompt,
      });
      return "";
    });
    files.push({ kind: "pptx", name, slides });
    return "";
  });
  text = text.replace(/<image prompt="([^"]+)"\s*\/>/g, (_, prompt) => {
    images.push(prompt);
    return "";
  });
  return { text: text.trim(), files, images, comments };
}

function formatSize(bytes) {

// Собирает настоящий .pptx через PptxGenJS
// XML перехода между слайдами
function transitionXml(t) {
  const map = {
    fade: '<p:transition spd="med"><p:fade/></p:transition>',
    push: '<p:transition spd="med"><p:push dir="u"/></p:transition>',
    wipe: '<p:transition spd="med"><p:wipe dir="d"/></p:transition>',
  };
  return map[t] || "";
}

// XML появления фигур по клику (эффект «Появление с затуханием»)
function timingXml(shapeIds) {
  let n = 3;
  const id = () => n++;
  let clicks = "";
  for (const spid of shapeIds) {
    const a = id(), b = id(), c = id(), d = id(), e = id();
    clicks += `<p:par><p:cTn id="${a}" fill="hold"><p:stCondLst><p:cond delay="indefinite"/></p:stCondLst><p:childTnLst><p:par><p:cTn id="${b}" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst><p:par><p:cTn id="${c}" presetID="10" presetClass="entr" presetSubtype="0" fill="hold" nodeType="clickEffect"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst><p:set><p:cBhvr><p:cTn id="${d}" dur="1" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst></p:cTn><p:tgtEl><p:spTgt spid="${spid}"/></p:tgtEl><p:attrNameLst><p:attrName>style.visibility</p:attrName></p:attrNameLst></p:cBhvr><p:to><p:strVal val="visible"/></p:to></p:set><p:animEffect transition="in" filter="fade"><p:cBhvr><p:cTn id="${e}" dur="500"/><p:tgtEl><p:spTgt spid="${spid}"/></p:tgtEl></p:cBhvr></p:animEffect></p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn></p:par>`;
  }
  return `<p:timing><p:tnLst><p:par><p:cTn id="1" dur="indefinite" restart="never" nodeType="tmRoot"><p:childTnLst><p:seq concurrent="1" nextAc="seek"><p:cTn id="2" dur="indefinite" nodeType="mainSeq"><p:childTnLst>${clicks}</p:childTnLst></p:cTn><p:prevCondLst><p:cond evt="onPrev" delay="0"><p:tgtEl><p:sldTgt/></p:tgtEl></p:cond></p:prevCondLst><p:nextCondLst><p:cond evt="onNext" delay="0"><p:tgtEl><p:sldTgt/></p:tgtEl></p:cond></p:nextCondLst></p:seq></p:childTnLst></p:cTn></p:par></p:tnLst></p:timing>`;
}

// Дописывает переходы и анимации в готовый .pptx
async function applyAnimations(buf, slides) {
  if (typeof JSZip === "undefined") return buf;
  const zip = await JSZip.loadAsync(buf);
  for (let i = 0; i < slides.length; i++) {
    const path = `ppt/slides/slide${i + 1}.xml`;
    const file = zip.file(path);
    if (!file) continue;
    const sl = slides[i];
    let xml = await file.async("string");
    const ids = [...xml.matchAll(/<p:cNvPr id="(\d+)"/g)].map((m) => m[1]).filter((x) => x !== "1");
    let extra = transitionXml(sl.transition);
    if (sl.animate === "fade" && ids.length) extra += timingXml(ids);
    xml = xml.replace("</p:sld>", extra + "</p:sld>");
    zip.file(path, xml);
  }
  return zip.generateAsync({ type: "arraybuffer" });
}

// Собирает .pptx через PptxGenJS: картинки на слайдах, затем переходы и анимации
async function savePptx(f) {
  if (typeof PptxGenJS === "undefined") {
    alert("Не загрузилась библиотека презентаций. Проверьте интернет и обновите страницу.");
    return;
  }
  const pptx = new PptxGenJS();
  f.slides.forEach((sl) => {
    const slide = pptx.addSlide();
    slide.addText(sl.title || " ", {
      x: 0.5, y: 0.4, w: 9, h: 1,
      fontSize: 30, bold: true, color: "E53935",
    });
    if (sl.bullets.length) {
      slide.addText(
        sl.bullets.map((b) => ({ text: b, options: { bullet: true, breakLine: true } })),
        { x: 0.5, y: 1.6, w: sl.imageData ? 4.4 : 9, h: 4.8, fontSize: 18, color: "222222", valign: "top" }
      );
    }
    if (sl.imageData) {
      slide.addImage({ data: sl.imageData, x: 5.2, y: 1.6, w: 4.3, h: 3.6 });
    }
  });
  let buf = await pptx.write({ outputType: "arraybuffer" });
  buf = await applyAnimations(buf, f.slides);
  saveBlob(
    f.name,
    new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.presentationml.presentation" })
  );
}

// Карточка файла или презентации с кнопкой скачивания
function buildFileCard(f) {
  const isPptx = f.kind === "pptx";
  const card = document.createElement("div");
  card.className = "file-card";
  card.innerHTML = `${isPptx ? SLIDES_ICON : FILE_ICON}<div class="file-meta"><span class="file-name"></span><span class="file-size"></span></div><button class="ghost-btn" title="Скачать">${DOWNLOAD_ICON}</button>`;
  card.querySelector(".file-name").textContent = f.name;
  card.querySelector(".file-size").textContent = isPptx
    ? `${f.slides.length} сл.`
    : formatSize(new Blob([f.content]).size);
  card.querySelector("button").addEventListener("click", () => {
    if (isPptx) savePptx(f);
    else saveText(f.name, f.content);
  });
  return card;
}

// ===== Сообщения =====
function renderMessage(m) {
  hero.classList.add("hidden");
  const div = document.createElement("div");
  div.className = `msg ${m.role === "user" ? "user" : "bot"} ${m.cls || ""}`.trim();
  if (m.image) {
    div.classList.add("image-msg");
    div.appendChild(buildImageBlock(m.image, m.text));
  } else {
    div.textContent = m.text;
    (m.files || []).forEach((f) => div.appendChild(buildFileCard(f)));
  }
  messagesEl.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addMessage(role, text, cls = "") {
  const m = { role, text, cls };
  messages.push(m);
  return { el: renderMessage(m), m };
}

// Блок с картинкой: превью, подпись и кнопка скачивания
function buildImageBlock(url, caption) {
  const wrap = document.createElement("div");
  wrap.className = "img-block";
  const img = document.createElement("img");
  img.src = url;
  img.alt = caption || "Изображение";
  img.loading = "lazy";
  img.addEventListener("click", () => window.open(url, "_blank"));
  const row = document.createElement("div");
  row.className = "img-row";
  const cap = document.createElement("span");
  cap.textContent = caption || "";
  const dl = document.createElement("button");
  dl.className = "ghost-btn";
  dl.title = "Скачать";
  dl.innerHTML = DOWNLOAD_ICON;
  dl.addEventListener("click", () => downloadImage(url));
  row.append(cap, dl);
  wrap.append(img, row);
  return wrap;
}

async function downloadImage(url) {
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    saveBlob(`redsba-${Date.now()}.png`, blob);
  } catch (e) {
    window.open(url, "_blank");
  }
}

// Собирает содержимое сообщения пользователя с учётом файлов
function buildUserContent(text, files) {
  const textParts = [];
  const images = [];
  for (const f of files) {
    if (f.kind === "text") {
      textParts.push(`--- Файл: ${f.name} ---\n${f.content}`);
    } else if (f.kind === "image") {
      images.push({ type: "image_url", image_url: { url: f.content } });
    } else {
      textParts.push(`[Прикреплён файл ${f.name}, его содержимое не поддерживается]`);
    }
  }
  const fullText = [text, ...textParts].filter(Boolean).join("\n\n");
  if (!images.length) return fullText;
  return [{ type: "text", text: fullText }, ...images];
}

// ===== Генерация картинок =====
async function requestImageUrl(model, prompt, refs = []) {
  const res = await apiFetch("/images/generations", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model,
      prompt,
      n: 1,
      size: "1024x1024",
      ...(refs.length ? { image: refs } : {}),
    }),
    timeout: 180000,
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  const data = await res.json();
  const item = data.data?.[0];
  let url = item?.url;
  if (!url && item?.b64_json) url = `data:image/png;base64,${item.b64_json}`;
  if (!url) throw new Error("Сервер не вернул картинку");
  return url;
}

// Картинка как data-URL (нужна для встраивания в pptx)
async function toDataUrl(url) {
  if (url.startsWith("data:")) return url;
  const blob = await (await fetch(url)).blob();
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function generateImage(model, prompt, pending, refs = []) {
  const url = await requestImageUrl(model, prompt, refs);
  pending.m.text = prompt;
  pending.m.image = url;
  pending.m.cls = "";
  pending.el.className = "msg bot image-msg";
  pending.el.textContent = "";
  pending.el.appendChild(buildImageBlock(url, prompt));
}

// Картинка по тегу <image> из ответа текстовой модели
async function makeImageReply(prompt) {
  const p = addMessage("bot", "Генерирую картинку...", "typing");
  saveChat();
  try {
    await generateImage(settings.imageModel || "flux", prompt, p, []);
  } catch (e) {
    const msg = e.name === "AbortError" ? "сервер не ответил вовремя" : e.message;
    p.m.text = `Ошибка картинки: ${msg}`;
    p.m.cls = "error";
    p.el.className = "msg bot error";
    p.el.textContent = p.m.text;
  }
  saveChat();
}

// Комментарий модели: отдельный пузырь выше основного ответа
function insertCommentBefore(pending, text) {
  const m = { role: "bot", text, cls: "comment" };
  messages.splice(messages.indexOf(pending.m), 0, m);
  const div = document.createElement("div");
  div.className = "msg bot comment";
  div.textContent = text;
  messagesEl.insertBefore(div, pending.el);
}

// Текст ответа, который уже можно показать (без незакрытых тегов)
function liveText(partial) {
  let t = parseAnswer(partial).text;
  const cut = t.search(/<(file|presentation|image|comment)\b/);
  if (cut >= 0) t = t.slice(0, cut);
  return t.trim();
}

// Читает потоковый ответ (SSE) и вызывает onDelta с накопленным текстом
async function readStream(res, onDelta) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  let full = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 1);
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if (!data || data === "[DONE]") continue;
      try {
        const delta = JSON.parse(data).choices?.[0]?.delta?.content;
        if (delta) {
          full += delta;
          onDelta(full);
        }
      } catch (e) {
        // неполная строка, пропускаем
      }
    }
  }
  return full;
}

// ===== Капча каждые 3 сообщения =====
let captchaCount = Number(localStorage.getItem(CAPTCHA_KEY) || 0);

function setCaptchaCount(n) {
  captchaCount = n;
  localStorage.setItem(CAPTCHA_KEY, String(n));
}

function showCaptcha(onOk) {
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-head"><span>Проверка</span></div>
      <div class="modal-body captcha-body">
        <p class="captcha-text">Подтвердите, что вы человек, чтобы продолжить.</p>
        <div class="cf-box"></div>
        <p class="captcha-err"></p>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const box = modal.querySelector(".cf-box");
  const err = modal.querySelector(".captcha-err");

  const render = () => {
    window.hcaptcha.render(box, {
      sitekey: HCAPTCHA_SITEKEY,
      callback: () => {
        modal.remove();
        setCaptchaCount(0);
        onOk();
      },
      "error-callback": () => {
        err.textContent = "Проверка не прошла, попробуйте ещё раз";
      },
    });
  };

  // Ждём загрузку скрипта Cloudflare, но не дольше 10 секунд
  let waited = 0;
  const timer = setInterval(() => {
    waited += 200;
    if (window.hcaptcha) {
      clearInterval(timer);
      render();
    } else if (waited >= 10000) {
      clearInterval(timer);
      err.textContent = "Не загрузилась проверка. Проверьте интернет и обновите страницу.";
    }
  }, 200);
}

// ===== Отправка =====
async function send() {
  if (busy) return;
  const text = input.value.trim();
  if (!text && !attachments.length) return;
  if (!selectedModel) {
    addMessage("bot", "Сначала выберите модель.", "error");
    saveChat();
    return;
  }

  if (captchaCount >= CAPTCHA_EVERY) {
    showCaptcha(() => send());
    return;
  }

  const imageMode = isImageModel(selectedModel);
  const refs = attachments.filter((a) => a.kind === "image").map((a) => a.content);
  const content = buildUserContent(text, attachments);
  const shown = text + (attachments.length ? `\n📎 ${attachments.map((a) => a.name).join(", ")}` : "");
  addMessage("user", shown);
  setCaptchaCount(captchaCount + 1);
  if (!imageMode) history.push({ role: "user", content });

  input.value = "";
  input.style.height = "auto";
  attachments = [];
  renderFiles();

  busy = true;
  sendBtn.disabled = true;
  const pending = addMessage("bot", imageMode ? "Генерирую картинку..." : "Думаю...", "typing");
  saveChat();

  try {
    if (imageMode) {
      if (!text) throw new Error("Опишите, какую картинку создать");
      await generateImage(selectedModel, text, pending, refs);
    } else {
      const res = await apiFetch("/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: selectedModel,
          messages: [{ role: "system", content: buildSystemPrompt() }, ...history],
          stream: true,
        }),
        timeout: 120000,
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

      let shownComments = 0;
      const answer = await readStream(res, (partial) => {
        const live = parseAnswer(partial);
        while (shownComments < live.comments.length) {
          insertCommentBefore(pending, live.comments[shownComments++]);
        }
        const t = liveText(partial);
        if (t) {
          pending.el.classList.remove("typing");
          pending.el.textContent = t;
        }
        chat.scrollTop = chat.scrollHeight;
      });
      history.push({ role: "assistant", content: answer });

      const parsed = parseAnswer(answer);
      const slideImages = parsed.files
        .filter((f) => f.kind === "pptx")
        .flatMap((f) => f.slides.filter((sl) => sl.imagePrompt));
      if (slideImages.length) {
        pending.el.textContent = "Генерирую картинки для презентации...";
        for (const sl of slideImages) {
          try {
            const url = await requestImageUrl(settings.imageModel || "flux", sl.imagePrompt);
            sl.imageData = await toDataUrl(url);
          } catch (err) {
            console.error("Картинка слайда не создана", err);
          }
        }
      }
      while (shownComments < parsed.comments.length) {
        insertCommentBefore(pending, parsed.comments[shownComments++]);
      }
      pending.m.text = parsed.text || (parsed.files.length ? "" : "(пустой ответ)");
      pending.m.files = parsed.files;
      pending.m.cls = "";
      pending.el.textContent = pending.m.text;
      pending.el.classList.remove("typing");
      parsed.files.forEach((f) => pending.el.appendChild(buildFileCard(f)));

      if (settings.plugins.images) {
        for (const prompt of parsed.images) {
          await makeImageReply(prompt);
        }
      }
    }
  } catch (e) {
    const msg = e.name === "AbortError" ? "сервер не ответил вовремя, попробуйте ещё раз" : e.message;
    pending.m.text = `Ошибка: ${msg}`;
    pending.m.cls = "error";
    pending.el.className = "msg bot error";
    pending.el.textContent = pending.m.text;
    if (!imageMode) history.pop(); // убираем неудачный вопрос из истории
  } finally {
    busy = false;
    sendBtn.disabled = false;
    saveChat();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});

loadChat();
loadModels();

</script>
