<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>redSBA ai</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">red<span>SBA</span> ai</div>
    <button id="clearBtn" class="ghost-btn" type="button" title="Новый чат">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main id="chat">
    <section id="hero" class="hero">
      <h1>Чем могу помочь?</h1>
      <p>Задайте вопрос, выберите модель и при желании прикрепите файлы.</p>
    </section>
    <div id="messages" class="messages"></div>
  </main>

  <footer class="composer-wrap">
    <div id="fileList" class="file-list"></div>
    <div class="model-row">
      <div class="model-wrap">
        <button id="modelBtn" class="model-btn" type="button">
          <span id="modelName">Загрузка моделей...</span>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="modelPanel" class="model-panel"></div>
      </div>
    </div>
    <div class="composer">
      <label class="btn-outline icon-btn" title="Прикрепить файлы">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a5 5 0 01-7-7L14 4.5a3.5 3.5 0 015 5L10.5 18a2 2 0 01-3-3L16 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input type="file" id="fileInput" multiple hidden />
      </label>
      <textarea id="input" rows="1" placeholder="Введите вопрос..."></textarea>
      <button id="sendBtn" class="btn-gradient icon-btn" title="Отправить">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
